name: CI - twd tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # json-server first: the app's axios client and loaders talk to it on port 3001.
      - name: Start mock API
        run: |
          nohup npm run serve > json-server.log 2>&1 &
          npx wait-on http://localhost:3001/todos

      # /testing is the empty mount page the tests render into (twd.config.json url).
      - name: Start dev server
        run: |
          nohup npm run dev:ci > vite.log 2>&1 &
          npx wait-on http://localhost:5173/testing --timeout 60000 || (echo "Server failed to start" && cat vite.log && exit 1)
        env:
          CI: true

      - name: Run TWD tests
        uses: BRIKEV/twd-cli/.github/actions/run@main

      - name: Display coverage
        run: npm run collect:coverage:text
